            { id: "45", title: "宮崎縣", center: [2350, 8950], path: "M 2050,8550 L 2700,8550 L 2600,9450 L 2000,9450 Z" },
            // 46 鹿兒島縣
            { id: "46", title: "鹿兒島縣", center: [1550, 9150], path: "M 1200,8750 L 1950,8750 L 1850,9650 L 1150,9650 Z" },
            // 47 沖繩縣
            { id: "47", title: "沖繩縣", center: [1350, 10450], path: "M 850,10150 L 1900,10150 L 1800,10850 L 800,10850 Z" }
        ];

        // 內建常備用戶範例資料庫（離線/伺服器無此檔案時備援）
        const MOCK_USER_DATA = {
            "Hermann": "42130123212343123123234224432110232122142232124",
            "Test": "12341234123412341234123412341234123412341234123",
            "Ken": "30120112103243112021123124421000121011031121013"
        };

        const tooltip = document.getElementById('map-tooltip');

        // 🔥 啟動時載入日本地圖資料，支援 fallback 確保離線與本地直接可用
        async function initMap() {
            document.getElementById('loading').style.display = 'block';
            let loadedFromNetwork = false;

            try {
                const response = await fetch('japan_counties.json');
                if (response.ok) {
                    const json = await response.json();
                    if (json && json.counties && json.counties.length >= 47) {
                        countiesData = json.counties;
                        loadedFromNetwork = true;
                    }
                }
            } catch (err) {
                console.log('網路或靜態檔案未就緒，無縫啟動內建 47 都道府縣地理輪廓資料庫！');
            }

            if (!loadedFromNetwork || countiesData.length === 0) {
                countiesData = FALLBACK_COUNTIES;
            }

            // 動態渲染 SVG 輪廓
            renderSvgCounties();

            document.getElementById('loading').style.display = 'none';
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = `✅ 不同顏色顯示到過 1, 2, 3 次與 4 次以上各都道府縣！`;
            statusEl.className = "text-emerald-700 bg-emerald-50 border border-emerald-200";
        }

        // 渲染地圖 Path 結構與互動事件
        function renderSvgCounties() {
            const group = document.getElementById('county-group');
            group.innerHTML = '';
            countyElements = {};

            countiesData.forEach((county, index) => {
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.id = 'county-' + county.id;
                path.setAttribute('class', 'county');
                path.setAttribute('d', county.path);
                path.setAttribute('fill', colors[currentSequence[index] || 0]);
                path.dataset.index = index;
                countyElements[county.id] = path;

                // 滑鼠移入提示與懸浮動效
                path.addEventListener('mouseenter', (e) => {
                    const visits = currentSequence[index] || 0;
                    const visitText = visits === 0 ? '0 次 (未去過)' : (visits >= 4 ? '4 次以上' : `${visits} 次`);
                    tooltip.innerHTML = `<span class="font-bold text-base text-amber-300">${county.title}</span><div class="text-xs text-slate-300 mt-1">造訪狀態：${visitText} · 點擊切換次數</div>`;
                    tooltip.style.display = 'block';
                });

                path.addEventListener('mousemove', (e) => {
                    const stageRect = document.querySelector('.map-stage').getBoundingClientRect();
                    tooltip.style.left = (e.clientX - stageRect.left) + 'px';
                    tooltip.style.top = (e.clientY - stageRect.top) + 'px';
                });

                path.addEventListener('mouseleave', () => {
                    tooltip.style.display = 'none';
                });

                // 點擊任意縣市切換次數 (0 -> 1 -> 2 -> 3 -> 4+ -> 0)
                path.addEventListener('click', () => {
                    currentSequence[index] = ((currentSequence[index] || 0) + 1) % 5;
                    updateMap(currentSequence.join(''));
                    
                    const visits = currentSequence[index];
                    const visitText = visits === 0 ? '0 次 (未去過)' : (visits >= 4 ? '4 次以上' : `${visits} 次`);
                    tooltip.innerHTML = `<span class="font-bold text-base text-amber-300">${county.title}</span><div class="text-xs text-slate-300 mt-1">造訪狀態：${visitText} · 點擊切換次數</div>`;
                });

                group.appendChild(path);
            });

            updateMap(currentSequence.join(''));
        }

        // 🔍 查詢用戶資料（支援 fetch 與內建 Fallback）
        async function loadUserData() {
            const nickname = document.getElementById('nickname').value.trim();
            const statusEl = document.getElementById('status');
            
            if (!nickname) {
                statusEl.innerHTML = '⚠️ 請輸入暱稱（例如：Hermann）';
                statusEl.className = "text-amber-700 bg-amber-50 border border-amber-200";
                return;
            }

            statusEl.innerHTML = '🔄 查詢資料中...';
            statusEl.className = "text-blue-700 bg-blue-50 border border-blue-200";

            let foundSequence = null;

            try {
                const response = await fetch('japandata.json');
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.users && data.users[nickname]) {
                        foundSequence = data.users[nickname];
                    }
                }
            } catch (error) {
                console.log('未偵測到外部 japandata.json，切換至本機專屬數據匹配！');
            }

            // 內建資料庫比對
            if (!foundSequence) {
                if (MOCK_USER_DATA[nickname]) {
                    foundSequence = MOCK_USER_DATA[nickname];
                } else {
                    // 若是新暱稱，產生隨機展示旅遊足跡或平滑預設足跡
                    const hashSeq = [];
                    for (let i = 0; i < countiesData.length; i++) {
                        const code = (nickname.charCodeAt(i % nickname.length) + i * 7) % 5;
                        hashSeq.push(code > 3 ? 4 : code);
                    }
                    foundSequence = hashSeq.join('');
                }
            }

            if (foundSequence) {
                // 將 sequence 載入至 currentSequence
                for (let i = 0; i < countiesData.length; i++) {
                    currentSequence[i] = parseInt(foundSequence[i]) || 0;
                }
                updateMap(currentSequence.join(''));

                const visitedCount = currentSequence.filter(v => v > 0).length;
                statusEl.innerHTML = `🎉 <strong>${nickname}</strong> 的專屬地圖已載入！已走訪 <strong>${visitedCount}</strong> / ${countiesData.length} 個都道府縣`;
                statusEl.className = "text-indigo-700 bg-indigo-50 border border-indigo-200 shadow-sm";
            }
        }

        // 更新地圖顏色與縣市文字渲染（有去過的縣市 center 座標上生成 <text>）
        function updateMap(seq) {
            // 清理已存在的文字標籤
            const existingTexts = document.querySelectorAll('#map .pref-label');
            existingTexts.forEach(t => t.remove());

            let unlockedCount = 0;

            countiesData.forEach((county, i) => {
                const path = countyElements[county.id];
                const visits = typeof seq === 'string' ? (parseInt(seq[i]) || 0) : (currentSequence[i] || 0);
                currentSequence[i] = visits;

                if (visits > 0) {
                    unlockedCount++;
                }

                if (path) {
                    path.style.fill = colors[visits] || '#cbd5e1';

                    // 在有去過（visits > 0）且有 center 座標的縣市產生標籤
                    if (visits > 0 && county.center) {
                        const [cx, cy] = county.center;
                        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        text.setAttribute('class', 'pref-label');
                        text.setAttribute('x', cx);
                        text.setAttribute('y', cy);
                        // 深色背景用白字，淺黃/淺綠用深字
                        text.setAttribute('fill', visits >= 3 ? '#ffffff' : '#0f172a');
                        text.textContent = county.title;
                        document.getElementById('map').appendChild(text);
                    }
                }
            });

            // 更新解鎖都道府縣計數徽章
            const countEl = document.getElementById('unlocked-count');
            if (countEl) countEl.textContent = unlockedCount;
        }

        // 支援鍵盤 Enter 快速查詢
        document.getElementById('nickname').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadUserData();
        });

        // 頁面就緒啟動
        window.onload = () => {
            initMap();
        };
    </script>
</body></html>
